# Contour config, converted from ~/.config/kitty/kitty.conf + nord.conf

default_profile: main
live_config: true

# No tab bar or tab sidebar, even with several tabs open.
tab_bar_visibility: Never
tab_placement: Top
sidebar:
  visible: false

profiles:
  main:
    # true hands decorations to the window manager, and bspwm draws none.
    # false would make Contour draw its own header bar (with tabs) instead.
    show_title_bar: true
    status_line:
      display: none
    scrollbar:
      position: Hidden

    # Redraw at the new size straight away, with no "cols x lines" overlay
    size_indicator_on_resize: false

    font:
      size: 11
      regular:
        family: "JetBrainsMono Nerd Font"

    cursor_motion_animation_duration: 150
    cursor:
      shape: block
      blinking: false

    history:
      limit: 10000
      scroll_multiplier: 3

    background:
      opacity: 1.0
      blur: false

    # No audio bell, alert on bell instead.
    bell:
      sound: "off"
      alert: true

    colors: nord

    permissions:
      display_host_writable_statusline: deny


color_schemes:
  nord:
    default:
      background: '#2E3440'
      foreground: '#ECEFF4'
    cursor:
      default: '#D8DEE9'
      text: '#2E3440'
    selection:
      background: '#4C566A'
      foreground: CellForeground
    normal:
      black:   '#3B4252'
      red:     '#BF616A'
      green:   '#A3BE8C'
      yellow:  '#EBCB8B'
      blue:    '#81A1C1'
      magenta: '#B48EAD'
      cyan:    '#88C0D0'
      white:   '#E5E9F0'
    bright:
      black:   '#4C566A'
      red:     '#BF616A'
      green:   '#A3BE8C'
      yellow:  '#EBCB8B'
      blue:    '#81A1C1'
      magenta: '#B48EAD'
      cyan:    '#8FBCBB'
      white:   '#ECEFF4'

input_mapping:
  # Shift+Return sends Escape, Return
  - { mods: [Shift], key: Enter, action: SendChars, chars: "\x1b\r" }

  - { mods: [Control, Shift], key: C, action: CopySelection }
  - { mods: [Control, Shift], key: V, action: PasteClipboard }
  - { mods: [Shift], key: Insert, action: PasteSelection }
  - { mods: [Control, Shift], key: Plus, action: IncreaseFontSize }
  - { mods: [Control, Shift], key: Equal, action: IncreaseFontSize }
  - { mods: [Control, Shift], key: Minus, action: DecreaseFontSize }
  - { mods: [Control, Shift], key: Backspace, action: ResetFontSize }
  - { mods: [Shift], key: PageUp, action: ScrollPageUp }
  - { mods: [Shift], key: PageDown, action: ScrollPageDown }
  - { mods: [Shift], key: Home, action: ScrollToTop }
  - { mods: [Shift], key: End, action: ScrollToBottom }
  - { mods: [Control, Shift], key: F, action: SearchReverse }
  - { mods: [Control, Shift], key: N, action: NewTerminal }
  - { mods: [Control], mouse: WheelUp, action: IncreaseFontSize }
  - { mods: [Control], mouse: WheelDown, action: DecreaseFontSize }
  - { mods: [], mouse: Middle, action: PasteSelection }
