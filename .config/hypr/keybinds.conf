# Define default programs
$terminal = /usr/bin/kitty
$file_manager = /usr/bin/kitty -e ranger
$browser = /usr/bin/brave
$run_menu = /usr/bin/rofi -show run -theme launcher.rasi
$app_menu = /usr/bin/rofi -show drun -theme launcher.rasi
$file_menu = /usr/bin/rofi -show filebrowser -theme launcher.rasi
$window_menu = /usr/bin/rofi -show window -theme launcher.rasi
$ssh_menu = /usr/bin/rofi -show ssh -theme launcher.rasi
$wifi_menu = /usr/bin/rofi -show wifi -theme launcher.rasi
$power = ~/.local/bin/rofi-power

# Modifier key definitions
$main_mod = SUPER
$main_ctrl = $main_mod CONTROL
$main_alt = $main_mod ALT
$main_shift = $main_mod SHIFT
$ctrl_alt = CONTROL ALT
$ctrl_shift = CONTROL SHIFT
$ctrl_alt_shift = CONTROL ALT SHIFT
$alt_shift = ALT SHIFT
$main_ctrl_shift = $main_mod CTRL SHIFT
$main_alt_shift = $main_mod ALT SHIFT
$main_ctrl_alt_shift = $main_mod CTRL ALT SHIFT

# Menus
bind = $main_mod, A, exec, $run_menu
bind = $main_mod, D, exec, $app_menu
bind = $main_mod, B, exec, $file_menu
bind = $main_mod, I, exec, $wifi_menu
bind = $main_mod, W, exec, $window_menu
bind = $main_mod, S, exec, $ssh_menu
bind = $main_mod, Q, exec, $power

# Applications
bind = $main_shift, C, killactive,
bind = $main_mod, L, exec, wallock -o lock
bind = $main_ctrl, L, exec, wallock -o stop
bind = $main_shift, L, exec, wallock -o next
bind = $main_shift, RETURN, exec, $terminal
bind = $main_ctrl, RETURN, exec, $file_manager
bind = $main_alt, RETURN, exec, /usr/bin/emacs
bind = $main_shift, L, exec, ~/.local/bin/set_hypr_opacity 1
bind = $main_ctrl_shift, L, exec, ~/.local/bin/set_hypr_opacity 2
bind = $main_alt_shift, L, exec, ~/.local/bin/set_hypr_opacity 3

# Screenshots
bind = $main_ctrl, S, exec, grim screenshot-"$(date +%Y%m%d%H%M%S)".png && notify-send -ei ~/.local/share/icons/dunst/screenshot.png "Screenshot taken"
bind = $main_alt, S, exec, grim -g "$(slurp)" screenshot-"$(date +%Y%m%d%H%M%S)".png && notify-send -ei ~/.local/share/icons/dunst/screenshot.png "Screenshot taken"

# Window modes
bind = $main_ctrl, SPACE, togglefloating
bind = $main_mod, F, fullscreenstate, -1, 2
bind = $main_ctrl, F, fullscreen, 0
bind = $main_mod, M, fullscreen, 1
bind = $main_mod, O, layoutmsg, orientationcycle left top
bind = $main_shift, M, layoutmsg, addmaster
bind = $main_ctrl, M, layoutmsg, removemaster
bind = $main_mod, P, layoutmsg, swapwithmaster
bind = $main_mod, C, centerwindow

# Move/resize windows with main_mod + LMB/RMB and dragging
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# Resize windows with main_mod + alt + R, then arrows; esc to exit
bind = $main_alt, R, submap, resize
submap = resize
binde =, RIGHT, resizeactive, 10 0
binde =, LEFT, resizeactive, -10 0
binde =, UP, resizeactive, 0 -10
binde =, DOWN, resizeactive, 0 10
bind =, ESCAPE, submap, reset
submap = reset

# Move focus with main_mod + arrow keys
bind = $main_mod, LEFT, movefocus, l
bind = $main_mod, RIGHT, movefocus, r
bind = $main_mod, UP, movefocus, u
bind = $main_mod, DOWN, movefocus, d

# Swap windows with SUPER + CONTROL + arrows
bind = $main_mod CONTROL, RIGHT, swapwindow, r
bind = $main_mod CONTROL, LEFT, swapwindow, l
bind = $main_mod CONTROL, UP, swapwindow, u
bind = $main_mod CONTROL, DOWN, swapwindow, d

# Switch workspaces with main_mod + [1-9]
bind = $main_mod, 1, workspace, 1
bind = $main_mod, 2, workspace, 2
bind = $main_mod, 3, workspace, 3
bind = $main_mod, 4, workspace, 4
bind = $main_mod, 5, workspace, 5
bind = $main_mod, 6, workspace, 6
bind = $main_mod, 7, workspace, 7
bind = $main_mod, 8, workspace, 8
bind = $main_mod, 9, workspace, 9

# Move active window to a workspace with main_mod + SHIFT + [1-9]
bind = $main_mod SHIFT, 1, movetoworkspace, 1
bind = $main_mod SHIFT, 2, movetoworkspace, 2
bind = $main_mod SHIFT, 3, movetoworkspace, 3
bind = $main_mod SHIFT, 4, movetoworkspace, 4
bind = $main_mod SHIFT, 5, movetoworkspace, 5
bind = $main_mod SHIFT, 6, movetoworkspace, 6
bind = $main_mod SHIFT, 7, movetoworkspace, 7
bind = $main_mod SHIFT, 8, movetoworkspace, 8
bind = $main_mod SHIFT, 9, movetoworkspace, 9

# Dunst hotkeys
bind = $main_mod, backslash, exec, dunstctl close
bind = $main_shift, backslash, exec, dunstctl close-all
bind = $main_ctrl, backslash, exec, dunstctl context
bind = $ctrl_alt_shift, backslash, exec, dunstctl history-pop

# Spotify
bind = $main_shift, SPACE, exec, playerctl play-pause --player=spotify
bind = $main_shift, RIGHT, exec, playerctl next --player=spotify
bind = $main_shift, LEFT, exec, playerctl previous --player=spotify

# Media Keys
# Use the same Spotify/MPD selection as the X11 bindings.
binde =, XF86MonBrightnessDown, exec, xbacklight -dec 5
binde =, XF86MonBrightnessUp, exec, xbacklight -inc 5
bind =, XF86AudioMute, exec, pamixer -t
bind =, XF86AUdioMicMute, exec, pamixer --source 1 -t
binde =, XF86AudioRaiseVolume, exec, pamixer -u -i 5
binde =, XF86AudiolowerVolume, exec, pamixer -u -d 5
bind =, XF86AudioPlay, exec, ~/.local/bin/media_control play-pause
bind =, XF86AudioNext, exec, ~/.local/bin/media_control next
bind =, XF86AudioPrev, exec, ~/.local/bin/media_control previous
