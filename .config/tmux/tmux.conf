# Configuration for tmux

# -- Plugins
# TPM must list itself: its clean command (prefix + alt + u) deletes every
# plugin directory that is not listed here, including its own.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sidebar'

# -- Plugin Settings
set -g @prefix_highlight_bg               cyan
set -g @prefix_highlight_copy_mode_attr   "fg=black,bg=cyan"
set -g @prefix_highlight_fg               black
set -g @prefix_highlight_prefix_prompt    'cmd'
set -g @sidebar-tree-command              'tree -c'

# -- General Settings
# Inside tmux, TERM should describe tmux itself. terminal-features matches the
# outer terminal's TERM. Append RGB support, and focus reporting for Alacritty
# (tmux's defaults cover only xterm*), without replacing tmux's defaults.
set -g default-terminal    "tmux-256color"
set -as terminal-features  ",xterm-256color:RGB,alacritty:RGB:focus"
set -g mouse               off
# Pass focus changes to programs, so Vim can reload files changed elsewhere.
set -g focus-events        on
set -g base-index          1
set -g pane-base-index     1
set -g history-limit       5000
# Wait 10ms to tell Escape from key sequences, so keys survive slow SSH links.
set -s escape-time         10
set -g bell-action         none
set -g visual-bell         on
set -g visual-activity     on
set-option -g allow-rename off

# -- Interface Settings
set  -g status-interval              1
set  -g status                       on
set  -g status-justify               left
set  -g status-style                 fg=white,bg=brightblack,none
set  -g pane-border-style            fg=black,bg=black
set  -g pane-active-border-style     fg=blue,bg=black
set  -g display-panes-colour         black
set  -g display-panes-active-colour  brightblack
set  -g message-style                fg=cyan,bg=brightblack
set  -g message-command-style        fg=cyan,bg=brightblack
set  -g status-left-length           12
set  -g status-left                  "#[fg=black,bg=cyan,bold] #{p10;=10:session_name} "
set  -g status-right                 "#{prefix_highlight}#[fg=cyan,bg=black] #{p-10;=10:host_short} #[fg=white,bg=brightblack] %d %b %Y #[fg=black,bg=cyan] %H:%M "
set  -g window-status-format         "#[fg=white,bg=brightblack] #I#{?window_flags,#{window_flags}, } #{p-8;=8:window_name} "
set  -g window-status-current-format "#[fg=cyan,bg=black] #I#F #{p-8;=8:window_name} "
set  -g window-status-separator      ""
setw -g clock-mode-colour            cyan
setw -g window-status-bell-style     fg=black,bg=red,bold
setw -g window-status-activity-style fg=black,bg=yellow,bold


# -- Keybindings
# Reload config
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"
# Session viewer
bind-key ^s choose-tree

# Pane management
bind   '\' split-window -h -c '#{pane_current_path}'
bind   '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Install TPM and its plugins on first use, then load TPM. TPM is cloned beside
# its final location and moved into place only once complete, so an interrupted
# clone never leaves a directory that later starts would trust.
run-shell -b 'plugin_dir="${TMUX_PLUGIN_MANAGER_PATH:-${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins}"; \
	plugin_dir="${plugin_dir%/}/"; \
	tpm_dir="${plugin_dir}tpm"; \
	export TMUX_PLUGIN_MANAGER_PATH="${plugin_dir}"; \
	tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "${plugin_dir}" || exit 1; \
	if [ ! -e "${tpm_dir}" ]; then \
		mkdir -p "${plugin_dir}" || exit 1; \
		rm -rf -- "${tpm_dir}.download"; \
		git clone -q https://github.com/tmux-plugins/tpm "${tpm_dir}.download" || exit 1; \
		mv -- "${tpm_dir}.download" "${tpm_dir}" || exit 1; \
		"${tpm_dir}/bin/install_plugins" || exit 1; \
	fi; \
	if [ ! -x "${tpm_dir}/tpm" ]; then \
		tmux display-message "TPM in ${tpm_dir} is incomplete; remove it to reinstall"; \
		exit 1; \
	fi; \
	exec "${tpm_dir}/tpm"'
