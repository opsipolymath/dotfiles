[section/includes]
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[global/wm]
margin-top = 5
margin-bottom = 5

[bar/default]
width = 100%
height = ${xrdb:panelHeight}
radius = ${xrdb:radius}
fixed-center = false
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}
border-size = ${xrdb:gap}
border-color = ${colors.transparent}
line-size = 3
line-color = ${colors.active}

modules-left = bspwm
modules-center = media-icon media output
modules-right = wlan0 wlan1 wireguard xbacklight pulseaudio battery date tray

font-0 = JetBrains Mono Nerd Font:style=Regular:pixelsize=9:antialias=true;2
font-1 = Material Design Icons:pixelsize=12:style=Regular;4
font-2 = Junicode:style=Bold:pixelsize=12:antialias=true;3
font-3 = JetBrains Mono Nerd Font:style=Regular:pixelsize=12:antialias=true;2

wm-restack = bspwm
override-redirect = true

cursor-click = pointer
cursor-scroll = ns-resize
