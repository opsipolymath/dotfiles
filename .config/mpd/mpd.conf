# Configuration for mpd

db_file "~/.local/share/mpd/database"
state_file "~/.local/share/mpd/state"
sticker_file "~/.local/share/mpd/sticker.sql"
music_directory "~/Music/Library"
playlist_directory "~/Music/Playlists"
log_file "syslog"
auto_update "yes"
restore_paused "yes"
# Listen on this machine only; nothing else needs to connect, so no password.
bind_to_address "localhost"

audio_output {
	type "pulse"
	name "pulse audio"
}

audio_output {
	type "fifo"
	name "my_fifo"
	path "/tmp/mpd.fifo"
	format "44100:16:2"
}

decoder {
	plugin "wildmidi"
	enabled "no"
}
