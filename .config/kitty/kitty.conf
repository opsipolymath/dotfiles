# Config file for kitty

include nord.conf

font_family JetBrains Mono Nerd Font
font_size 11.0

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
# Keep the block cursor at shell prompts; shell integration would switch it to
# a beam.
shell_integration no-cursor

scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Visual bell only
enable_audio_bell no
visual_bell_duration 0.2 linear
visual_bell_color #5E81AC

background_opacity 1.0

# Redraw at the new size at once. bspwm resizes windows in one step, so waiting
# for more resize events only shows a "cols by lines" placeholder in between.
resize_debounce_time 0

# Shift+Return sends Escape, Return.
map shift+enter send_text all \x1b\r
